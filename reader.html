<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b4f43"
  >

  <title>Reading — Mogge</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #eef5f2;
      font-family: Arial, sans-serif;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: #0b4f43;
      color: white;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .reader-nav {
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
      padding: 0 18px;
    }

    .back-link {
      color: white;
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }

    .reader-title {
      margin: 0;

      font-size: 18px;
      font-weight: 700;

      text-align: right;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================================================
       READER AREA
       ========================================================= */

    .reader-shell {
      width: min(1100px, calc(100% - 24px));

      margin:
        16px auto
        30px auto;
    }

    #viewer {
      position: relative;

      width: 100%;

      min-height:
        calc(100vh - 150px);

      background: white;

      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(16, 65, 53, 0.12);

      overflow: hidden;
    }

    /* EPUB.js creates an iframe inside this element. */

    #viewer iframe {
      display: block;

      width: 100% !important;

      border: 0 !important;

      background: white;
    }

    /* =========================================================
       LOADING / ERROR
       ========================================================= */

    .reader-message {
      min-height: 50vh;

      display: grid;
      place-items: center;

      padding: 30px;

      color: #65736f;

      text-align: center;

      line-height: 1.6;
    }

    .reader-error {
      max-width: 700px;

      margin: auto;

      padding: 30px;

      color: #8b2635;

      background: #fff1f3;

      border-radius: 14px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      .reader-nav {
        min-height: 58px;
        padding: 0 12px;
      }

      .back-link {
        font-size: 14px;
      }

      .reader-title {
        max-width: 55%;
        font-size: 15px;
      }

      .reader-shell {
        width: calc(100% - 10px);
        margin-top: 8px;
      }

      #viewer {
        border-radius: 12px;
      }
    }

  </style>
</head>

<body>

  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="reader-header">

    <div class="container reader-nav">

      <a
        class="back-link"
        href="./"
      >
        ← Back to Mogge
      </a>

      <h1
        id="readerTitle"
        class="reader-title"
      >
        Loading book…
      </h1>

    </div>

  </header>


  <!-- =========================================================
       EPUB VIEWER
       ========================================================= -->

  <main class="reader-shell">

    <div id="viewer">

      <div class="reader-message">
        Preparing the reader…
      </div>

    </div>

  </main>


  <!-- =========================================================
       LIBRARIES
       ========================================================= -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js">
  </script>


  <!-- =========================================================
       READER
       ========================================================= -->

  <script>

    "use strict";


    /* =========================================================
       URL PARAMETERS
       ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const requestedBook =
      params.get("book");


    /* =========================================================
       DOM
       ========================================================= */

    const viewer =
      document.getElementById("viewer");

    const readerTitle =
      document.getElementById("readerTitle");


    /* =========================================================
       GLOBAL READER VARIABLES
       ========================================================= */

    let book = null;

    let rendition = null;

    let currentSection = 0;

    let totalSections = 0;


    /* =========================================================
       MESSAGE
       ========================================================= */

    function message(text) {

      viewer.innerHTML = `
        <div class="reader-message">
          ${text}
        </div>
      `;

    }


    /* =========================================================
       ERROR
       ========================================================= */

    function showError(error) {

      console.error(
        "EPUB READER ERROR:",
        error
      );

      message(`
        <div class="reader-error">

          <strong>
            Unable to open this book.
          </strong>

          <br><br>

          ${escapeHtml(
            error && error.message
              ? error.message
              : String(error)
          )}

          <br><br>

          <small>
            Open the browser console for more details.
          </small>

        </div>
      `);

    }


    /* =========================================================
       HTML ESCAPE
       ========================================================= */

    function escapeHtml(value) {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }


    /* =========================================================
       WAIT
       ========================================================= */

    function wait(ms) {

      return new Promise(
        resolve => setTimeout(resolve, ms)
      );

    }


    /* =========================================================
       CHECK IF A SECTION IS PROBABLY EMPTY
       ========================================================= */

    async function sectionLooksEmpty(section) {

      try {

        if (!section) {
          return true;
        }

        await section.load(
          book.load.bind(book)
        );

        const document =
          section.document;

        if (!document) {
          return true;
        }

        const body =
          document.body;

        if (!body) {
          return true;
        }

        /*
         * Do NOT count scripts/styles/images as text.
         */

        const clone =
          body.cloneNode(true);

        clone
          .querySelectorAll(
            "script,style,noscript"
          )
          .forEach(
            el => el.remove()
          );

        const text =
          (clone.textContent || "")
            .replace(/\s+/g, "")
            .trim();

        /*
         * If there is meaningful text,
         * this is a real content section.
         */

        if (text.length > 20) {

          section.unload();

          return false;

        }


        /*
         * Sometimes a content page contains
         * an image but no text.
         *
         * Therefore check images.
         */

        const images =
          body.querySelectorAll("img");

        if (images.length > 0) {

          /*
           * A page containing only one or more
           * images can still be a real story page.
           *
           * Therefore we don't automatically
           * remove image-only pages.
           */

          section.unload();

          return false;

        }


        section.unload();

        return true;

      } catch (error) {

        console.warn(
          "Could not inspect section:",
          error
        );

        return false;

      }

    }


    /* =========================================================
       FIND FIRST REAL CONTENT SECTION
       ========================================================= */

    async function findFirstContentSection() {

      try {

        const spineItems =
          book.spine.spineItems || [];

        totalSections =
          spineItems.length;

        console.log(
          "EPUB spine sections:",
          totalSections
        );


        /*
         * Start from the beginning.
         */

        for (
          let i = 0;
          i < spineItems.length;
          i++
        ) {

          const section =
            spineItems[i];

          console.log(
            "Checking EPUB section:",
            i,
            section.href
          );


          const empty =
            await sectionLooksEmpty(
              section
            );


          if (!empty) {

            console.log(
              "First meaningful section:",
              i,
              section.href
            );

            return section;

          }

        }

      } catch (error) {

        console.warn(
          "Unable to inspect spine:",
          error
        );

      }


      /*
       * Fallback:
       * simply start from the first section.
       */

      return book.spine.get(0);

    }


    /* =========================================================
       INJECT EPUB CSS
       ========================================================= */

    function injectReaderStyles(contents) {

      try {

        const document =
          contents.document;

        if (!document) {
          return;
        }


        /*
         * Make sure the EPUB page fits
         * inside the iframe correctly.
         */

        const style =
          document.createElement("style");

        style.id =
          "mogge-reader-overrides";


        style.textContent = `

          html {
            margin: 0 !important;
            padding: 0 !important;

            width: 100% !important;
          }

          body {
            margin: 0 !important;

            width: 100% !important;

            box-sizing: border-box !important;

            overflow-x: hidden !important;
          }

          img,
          video,
          svg,
          canvas {
            max-width: 100% !important;

            box-sizing: border-box !important;
          }

          * {
            box-sizing: border-box;
          }

        `;


        document.head.appendChild(
          style
        );


        console.log(
          "Reader CSS injected."
        );

      } catch (error) {

        console.warn(
          "Could not inject reader CSS:",
          error
        );

      }

    }


    /* =========================================================
       RUN EPUB JAVASCRIPT
       ========================================================= */

    function enableBookScripts(contents) {

      try {

        const document =
          contents.document;

        if (!document) {
          return;
        }

        console.log(
          "Interactive EPUB section loaded."
        );


        /*
         * The important part is:
         *
         * allowScriptedContent: true
         *
         * in rendition options below.
         *
         * We intentionally DO NOT execute
         * script text ourselves here.
         *
         * EPUB.js handles the EPUB scripts
         * inside its sandboxed iframe.
         */

      } catch (error) {

        console.warn(
          "Script initialization warning:",
          error
        );

      }

    }


    /* =========================================================
       UPDATE LOCATION
       ========================================================= */

    function updateLocation(location) {

      if (!location) {
        return;
      }

      try {

        const start =
          location.start;

        if (!start) {
          return;
        }

        currentSection =
          start.index;

        console.log(
          "EPUB location:",
          location
        );

      } catch (error) {

        console.warn(
          "Location update failed:",
          error
        );

      }

    }


    /* =========================================================
       NEXT
       ========================================================= */

    async function nextPage() {

      if (!rendition) {
        return;
      }

      try {

        await rendition.next();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

        console.log(
          "Moved to next page."
        );

      } catch (error) {

        console.log(
          "Reached end of EPUB."
        );

      }

    }


    /* =========================================================
       PREVIOUS
       ========================================================= */

    async function previousPage() {

      if (!rendition) {
        return;
      }

      try {

        await rendition.prev();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

        console.log(
          "Moved to previous page."
        );

      } catch (error) {

        console.log(
          "Reached beginning of EPUB."
        );

      }

    }


    /* =========================================================
       KEYBOARD NAVIGATION
       ========================================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        /*
         * Don't interfere with typing inside
         * inputs/textareas/contenteditable.
         */

        const target =
          event.target;

        if (
          target &&
          (
            target.tagName === "INPUT" ||
            target.tagName === "TEXTAREA" ||
            target.isContentEditable
          )
        ) {

          return;

        }


        if (
          event.key === "ArrowRight" ||
          event.key === "PageDown"
        ) {

          event.preventDefault();

          nextPage();

        }


        if (
          event.key === "ArrowLeft" ||
          event.key === "PageUp"
        ) {

          event.preventDefault();

          previousPage();

        }

      }
    );


    /* =========================================================
       RESIZE
       ========================================================= */

    let resizeTimer = null;

    window.addEventListener(
      "resize",
      function() {

        clearTimeout(
          resizeTimer
        );

        resizeTimer =
          setTimeout(
            function() {

              if (rendition) {

                rendition.resize(
                  viewer.clientWidth,
                  viewer.clientHeight
                );

              }

            },
            200
          );

      }
    );


    /* =========================================================
       INITIALIZE
       ========================================================= */

    async function initReader() {

      try {

        /* -----------------------------------------------------
           CHECK BOOK PARAMETER
           ----------------------------------------------------- */

        if (!requestedBook) {

          message(
            "No book was selected."
          );

          return;

        }


        console.log(
          "Requested book:",
          requestedBook
        );


        /* -----------------------------------------------------
           LOAD BOOK CATALOGUE
           ----------------------------------------------------- */

        console.log(
          "Loading books.json..."
        );


        const response =
          await fetch(
            "./books.json",
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            `books.json could not be loaded (${response.status})`
          );

        }


        const data =
          await response.json();


        const books =
          Array.isArray(data)
            ? data
            : (data.books || []);


        console.log(
          "Books loaded:",
          books.length
        );


        /* -----------------------------------------------------
           FIND BOOK
           ----------------------------------------------------- */

        const selectedBook =
          books.find(
            item =>
              item.file === requestedBook
          );


        if (!selectedBook) {

          throw new Error(
            `Book not found in books.json: ${requestedBook}`
          );

        }


        /* -----------------------------------------------------
           TITLE
           ----------------------------------------------------- */

        readerTitle.textContent =
          selectedBook.title ||
          "Mogge Book";


        message(`
          <div>
            Opening
            <strong>
              ${escapeHtml(
                selectedBook.title ||
                "book"
              )}
            </strong>
            …
          </div>
        `);


        /* -----------------------------------------------------
           EPUB URL
           ----------------------------------------------------- */

        const bookUrl =
          new URL(
            selectedBook.file,
            window.location.href
          ).href;


        console.log(
          "Opening EPUB:",
          bookUrl
        );


        /* -----------------------------------------------------
           DOWNLOAD EPUB
           ----------------------------------------------------- */

        const epubResponse =
          await fetch(
            bookUrl,
            {
              cache: "no-cache"
            }
          );


        if (!epubResponse.ok) {

          throw new Error(
            `EPUB could not be downloaded (${epubResponse.status})`
          );

        }


        const epubData =
          await epubResponse.arrayBuffer();


        console.log(
          "EPUB downloaded:",
          epubData.byteLength,
          "bytes"
        );


        if (
          !epubData ||
          !epubData.byteLength
        ) {

          throw new Error(
            "The EPUB file is empty."
          );

        }


        /* -----------------------------------------------------
           CREATE EPUB
           ----------------------------------------------------- */

        book =
          ePub(epubData);


        /* -----------------------------------------------------
           WAIT FOR EPUB TO BE READY
           ----------------------------------------------------- */

        await book.ready;


        console.log(
          "EPUB book is ready."
        );


        /* -----------------------------------------------------
           METADATA
           ----------------------------------------------------- */

        try {

          const metadata =
            book.package &&
            book.package.metadata;

          if (
            metadata &&
            metadata.title
          ) {

            readerTitle.textContent =
              metadata.title;

          }

        } catch (error) {

          console.warn(
            "Metadata could not be read:",
            error
          );

        }


        /* -----------------------------------------------------
           FIND FIRST REAL SECTION
           ----------------------------------------------------- */

        // const firstSection =
        //   await findFirstContentSection();


        // if (!firstSection) {

        //   throw new Error(
        //     "No readable content section was found in this EPUB."
        //   );

        // }
        
        /* -----------------------------------------------------
          DISPLAY FIRST CONTENT (true start of the book, cover included)
          ----------------------------------------------------- */
          
        await rendition.display();
        console.log("EPUB rendered successfully.");

        console.log(
          "Starting section:",
          firstSection.href
        );


        /* -----------------------------------------------------
           CLEAR LOADING MESSAGE
           ----------------------------------------------------- */

        viewer.innerHTML = "";


        /* -----------------------------------------------------
           CREATE RENDITION
           -----------------------------------------------------

           IMPORTANT:

           allowScriptedContent: true

           This allows trusted EPUB JavaScript
           such as:

             Share
             Ignore
             Try Anyway
             Give Up
             choice buttons
             interactive story logic

           to run inside EPUB.js.
        */

        rendition =
          book.renderTo(
            "viewer",
            {

              width: "100%",

              height:
                "calc(100vh - 150px)",

              /*
               * Normal EPUB pagination.
               *
               * A long chapter is automatically
               * divided into multiple pages.
               */

              flow: "paginated",

              manager: "default",

              spread: "none",

              /*
               * VERY IMPORTANT:
               * Enable JavaScript inside trusted EPUBs.
               */

              allowScriptedContent: true,

              /*
               * Allow EPUB links/popups where
               * the book requires them.
               */

              allowPopups: true

            }
          );


        /* -----------------------------------------------------
           CONTENT HOOK
           ----------------------------------------------------- */

        rendition.hooks.content.register(
          function(contents) {

            injectReaderStyles(
              contents
            );

            enableBookScripts(
              contents
            );

          }
        );


        /* -----------------------------------------------------
           DISPLAY EVENT
           ----------------------------------------------------- */

        rendition.on(
          "displayed",
          function(section) {

            console.log(
              "EPUB section rendered:",
              section
            );

            /*
             * Always put the reader at the top
             * of the newly displayed section.
             */

            setTimeout(
              function() {

                window.scrollTo({
                  top: 0,
                  behavior: "auto"
                });

              },
              20
            );

          }
        );


        /* -----------------------------------------------------
           LOCATION EVENT
           ----------------------------------------------------- */

        rendition.on(
          "relocated",
          function(location) {

            updateLocation(
              location
            );

          }
        );


        /* -----------------------------------------------------
           LINK EVENT
           ----------------------------------------------------- */

        rendition.on(
          "linkClicked",
          function(href) {

            console.log(
              "EPUB link clicked:",
              href
            );

          }
        );


        /* -----------------------------------------------------
           DISPLAY FIRST CONTENT
           ----------------------------------------------------- */

        await rendition.display(
          firstSection.href
        );


        console.log(
          "EPUB rendered successfully."
        );


        /* -----------------------------------------------------
           FINAL RESIZE
           ----------------------------------------------------- */

        await wait(100);

        rendition.resize(
          viewer.clientWidth,
          viewer.clientHeight
        );


        console.log(
          "EPUB reader ready."
        );

      } catch (error) {

        showError(
          error
        );

      }

    }


    /* =========================================================
       START
       ========================================================= */

    initReader();

  </script>

</body>
</html>
