<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b4f43">

  <title>Reading — Mogge</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #eef5f2;
    }

    body {
      font-family: Arial, sans-serif;
    }

    /* ================================
       HEADER
       ================================= */

    .reader-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 68px;

      background: #0b4f43;
      color: white;

      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .reader-nav {
      width: min(1100px, calc(100% - 24px));
      height: 68px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .back-link {
      color: white;
      text-decoration: none;

      font-weight: 700;
      font-size: 16px;

      white-space: nowrap;
    }

    .reader-title {
      margin: 0;

      max-width: 60%;

      font-size: 18px;
      font-weight: 700;

      text-align: right;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ================================
       READER
       ================================= */

    .reader-shell {
      width: min(1100px, calc(100% - 24px));

      margin: 18px auto 30px;

      position: relative;
    }

    #viewer {
      position: relative;

      width: 100%;

      min-height: calc(100vh - 120px);

      background: white;

      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(16, 65, 53, 0.12);

      overflow: hidden;
    }

    /* EPUB.js creates this iframe/container */
    #viewer iframe {
      display: block;

      width: 100% !important;

      border: 0 !important;

      margin: 0 !important;

      padding: 0 !important;
    }

    /* EPUB.js manager */
    #viewer .epub-container {
      width: 100% !important;
      height: 100% !important;
    }

    /* EPUB.js view */
    #viewer .epub-view {
      width: 100% !important;
    }

    /* ================================
       LOADING / ERROR
       ================================= */

    .reader-message {
      min-height: 50vh;

      display: grid;
      place-items: center;

      padding: 30px;

      color: #65736f;

      text-align: center;

      font-size: 16px;
    }

    .reader-error {
      max-width: 700px;

      margin: auto;

      padding: 30px;

      color: #8b1e1e;

      background: #fff0f0;

      border-radius: 12px;
    }

    /* ================================
       MOBILE
       ================================= */

    @media (max-width: 600px) {

      .reader-header {
        height: 60px;
      }

      .reader-nav {
        height: 60px;
      }

      .reader-title {
        max-width: 55%;

        font-size: 15px;
      }

      .back-link {
        font-size: 14px;
      }

      .reader-shell {
        width: calc(100% - 10px);

        margin: 8px auto 15px;
      }

      #viewer {
        min-height: calc(100vh - 85px);

        border-radius: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================
       HEADER
       ========================================== -->

  <header class="reader-header">

    <div class="reader-nav">

      <a
        class="back-link"
        href="./"
      >
        ← Back to Mogge
      </a>

      <h1
        id="readerTitle"
        class="reader-title"
      >
        Loading book…
      </h1>

    </div>

  </header>


  <!-- =========================================
       READER
       ========================================== -->

  <main class="reader-shell">

    <div id="viewer">

      <div class="reader-message">
        Preparing the reader…
      </div>

    </div>

  </main>


  <!-- =========================================
       LIBRARIES
       ========================================== -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>


  <!-- =========================================
       READER SCRIPT
       ========================================== -->

  <script>

    const params =
      new URLSearchParams(window.location.search);

    const requestedBook =
      params.get("book");


    const viewer =
      document.getElementById("viewer");

    const readerTitle =
      document.getElementById("readerTitle");


    let book = null;

    let rendition = null;


    /* =========================================
       MESSAGE
       ========================================== */

    function message(text) {

      viewer.innerHTML = `

        <div class="reader-message">

          ${text}

        </div>

      `;

    }


    /* =========================================
       ERROR
       ========================================== */

    function showError(error) {

      console.error(
        "EPUB READER ERROR:",
        error
      );

      viewer.innerHTML = `

        <div class="reader-message">

          <div class="reader-error">

            <strong>
              Unable to open this book.
            </strong>

            <br><br>

            ${error.message || error}

            <br><br>

            <small>
              Check the browser console for more details.
            </small>

          </div>

        </div>

      `;
    }


    /* =========================================
       LOAD BOOK
       ========================================== */

    async function initReader() {

      try {

        /* -------------------------------------
           CHECK BOOK PARAMETER
           ------------------------------------- */

        if (!requestedBook) {

          message(
            "No book was selected."
          );

          return;
        }


        /* -------------------------------------
           LOAD BOOK CATALOGUE
           ------------------------------------- */

        console.log(
          "Loading books.json..."
        );


        const response =
          await fetch(
            "./books.json",
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            `books.json could not be loaded (${response.status})`
          );

        }


        const data =
          await response.json();


        const books =
          Array.isArray(data)
            ? data
            : (data.books || []);


        /* -------------------------------------
           FIND REQUESTED BOOK
           ------------------------------------- */

        const bookInfo =
          books.find(
            item =>
              item.file === requestedBook
          );


        if (!bookInfo) {

          throw new Error(
            `Book not found in books.json: ${requestedBook}`
          );

        }


        /* -------------------------------------
           TITLE
           ------------------------------------- */

        readerTitle.textContent =
          bookInfo.title ||
          "Mogge Book";


        message(
          `Opening <strong>${bookInfo.title || "book"}</strong>…`
        );


        /* -------------------------------------
           BUILD EPUB URL
           ------------------------------------- */

        const bookUrl =
          new URL(
            bookInfo.file,
            window.location.href
          ).href;


        console.log(
          "Opening EPUB:",
          bookUrl
        );


        /* -------------------------------------
           DOWNLOAD EPUB
           ------------------------------------- */

        const epubResponse =
          await fetch(
            bookUrl,
            {
              cache: "no-cache"
            }
          );


        if (!epubResponse.ok) {

          throw new Error(
            `EPUB could not be downloaded (${epubResponse.status})`
          );

        }


        const epubData =
          await epubResponse.arrayBuffer();


        console.log(
          "EPUB downloaded:",
          epubData.byteLength,
          "bytes"
        );


        if (!epubData.byteLength) {

          throw new Error(
            "The EPUB file is empty."
          );

        }


        /* -------------------------------------
           CLEAR LOADING SCREEN
           ------------------------------------- */

        viewer.innerHTML = "";


        /* =====================================
           CREATE EPUB
           ===================================== */

        book =
          ePub(epubData);


        /* =====================================
           CREATE RENDITION

           IMPORTANT:

           allowScriptedContent: true

           This is what allows JavaScript
           contained inside the EPUB to execute.
           ===================================== */

        rendition =
          book.renderTo(
            "viewer",
            {

              width: "100%",

              height: "100%",

              spread: "none",

              flow: "paginated",

              manager: "default",

              allowScriptedContent: true

            }
          );


        /* =====================================
           EPUB CSS / DISPLAY SETTINGS
           ===================================== */

        rendition.themes.default({

          "html": {

            "margin": "0 !important",

            "padding": "0 !important"

          },

          "body": {

            "margin": "0 !important",

            "padding": "0 !important",

            "width": "100% !important",

            "min-height": "100% !important",

            "box-sizing": "border-box !important"

          }

        });


        /* =====================================
           DISPLAY FIRST PAGE
           ===================================== */

        await rendition.display();


        console.log(
          "EPUB rendered successfully."
        );


        /* =====================================
           CONTENT EVENT
           ===================================== */

        rendition.on(
          "rendered",
          function(
            section,
            view
          ) {

            console.log(
              "EPUB section rendered:",
              section
            );

            /*
             * Make sure EPUB iframe occupies
             * the entire available reader area.
             */

            if (
              view &&
              view.iframe
            ) {

              view.iframe.style.width =
                "100%";

              view.iframe.style.border =
                "0";

            }

          }
        );


        /* =====================================
           LOCATION EVENT
           ===================================== */

        rendition.on(
          "relocated",
          function(location) {

            console.log(
              "EPUB location:",
              location
            );

          }
        );


        /* =====================================
           KEYBOARD NAVIGATION
           ===================================== */

        document.addEventListener(
          "keydown",
          function(event) {

            if (
              event.key === "ArrowRight" ||
              event.key === "PageDown"
            ) {

              rendition.next();

            }


            if (
              event.key === "ArrowLeft" ||
              event.key === "PageUp"
            ) {

              rendition.prev();

            }

          }
        );


      } catch (error) {

        showError(error);

      }

    }


    /* =========================================
       START
       ========================================== */

    initReader();

  </script>

</body>
</html>
